name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  checks:
    name: Lint and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and TypeScript checks
        run: pnpm exec vp run check

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm exec vp run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  sdk-tests:
    name: Cangjie SDK integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Cache Cangjie SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/cjslash/cangjie-sdk-linux-x64-1.2.1
          key: cangjie-sdk-linux-x64-1.2.1-5616624fcb48db150df2accde6669a2c8cc5e851d79e623a5469c4e4cd7a491f

      - name: Install Cangjie SDK
        shell: bash
        env:
          CJSLASH_SDK_VERSION: 1.2.1
          CJSLASH_SDK_SHA256: 5616624fcb48db150df2accde6669a2c8cc5e851d79e623a5469c4e4cd7a491f
          CJSLASH_SDK_DOWNLOAD_URL: https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.2.1.tar.gz&objectKey=6af2edbae4bd101f57762f7c
        run: |
          set -euo pipefail
          sdk_root="$HOME/.cache/cjslash/cangjie-sdk-linux-x64-${CJSLASH_SDK_VERSION}"
          archive="$RUNNER_TEMP/cangjie-sdk-linux-x64-${CJSLASH_SDK_VERSION}.tar.gz"
          if [[ ! -x "$sdk_root/bin/cjc" || ! -x "$sdk_root/tools/bin/LSPServer" ]]; then
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors "$CJSLASH_SDK_DOWNLOAD_URL" --output "$archive"
            echo "$CJSLASH_SDK_SHA256  $archive" | sha256sum --check --strict
            extracted="$RUNNER_TEMP/cangjie-sdk"
            mkdir -p "$extracted"
            tar --extract --gzip --file "$archive" --directory "$extracted"
            package_dir="$(find "$extracted" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            rm -rf "$sdk_root"
            mkdir -p "$(dirname "$sdk_root")"
            mv "$package_dir" "$sdk_root"
          fi
          chmod +x "$sdk_root/bin/cjc" "$sdk_root/tools/bin/LSPServer"
          echo "CJSLASH_SDK_PATH=$sdk_root" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm exec vp run build:vitepress

      - name: Run real-SDK integration tests
        run: pnpm exec vp run test:sdk

      - name: Build documentation with the SDK
        run: pnpm exec vp run docs:build

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 7

  documentation:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static documentation
        run: pnpm exec vp run docs:build

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-static
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 7

  deploy-docs:
    name: Deploy documentation to Netlify
    needs:
      - checks
      - unit-tests
      - sdk-tests
      - documentation
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.number) || 'production' }}
      url: ${{ steps.netlify.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Download SDK-built documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: docs/.vitepress/dist

      - name: Check Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" || -z "$NETLIFY_SITE_ID" ]]; then
            echo "::error::Set the NETLIFY_AUTH_TOKEN repository secret and NETLIFY_SITE_ID repository variable to deploy the documentation."
            exit 1
          fi

      - name: Deploy to Netlify
        id: netlify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_CONTEXT" == "deploy-preview" ]]; then
            deploy_flags=(--alias "deploy-preview-$PR_NUMBER" --message "Deploy preview from ${GITHUB_SHA}")
          else
            deploy_flags=(--prod --message "Deploy from ${GITHUB_SHA}")
          fi
          tool_root="$RUNNER_TEMP/netlify-cli"
          mkdir -p "$tool_root"
          cd "$tool_root"
          npm exec --yes --prefer-offline --package=netlify-cli@27.20.0 -- netlify deploy --site "$NETLIFY_SITE_ID" --dir "$GITHUB_WORKSPACE/docs/.vitepress/dist" --no-build "${deploy_flags[@]}" --json > "$RUNNER_TEMP/netlify-deploy.json"
          deployment_url="$(jq -er '.deploy_url // .url' "$RUNNER_TEMP/netlify-deploy.json")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf '### Netlify documentation deployment\n\n[View the deployed documentation](%s)\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOY_CONTEXT: ${{ github.event_name == 'pull_request' && 'deploy-preview' || 'production' }}
          PR_NUMBER: ${{ github.event.number }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
