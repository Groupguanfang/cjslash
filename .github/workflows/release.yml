name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm Trusted Publishing and provenance.
  id-token: write

jobs:
  release:
    name: Version or publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm exec vp run check

      - name: Run unit tests
        run: pnpm exec vp run test

      - name: Create version pull request or publish packages
        uses: changesets/action@v2
        with:
          version-script: pnpm exec changeset version
          publish-script: pnpm exec vp run build:vitepress && pnpm exec changeset publish
          commit-message: '♻️ chore(release): version packages'
          pr-title: '♻️ chore(release): version packages'
          pr-base-branch: main
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
